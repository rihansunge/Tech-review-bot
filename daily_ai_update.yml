name: Daily AI update

on:
  schedule:
    - cron: "0 9 * * *"   # every day at 09:00 UTC (12:00 in Qatar)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AFFILIATE_TAG: "YOUR-TAG-HERE"     # put your Amazon Associates tag here
          AMAZON_DOMAIN: "amazon.ae"         # change if your Associates account is for another store
        run: python generate_reviews.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --staged --quiet || git commit -m "Daily update"
          git push
